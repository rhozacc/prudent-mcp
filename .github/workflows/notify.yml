name: Notify

# Emails the owner when something big happens in the release pipeline: a release
# going out, or the thing that publishes it failing.
#
# A notice is one POST to the dashboard (/api/ops/notify). The dashboard checks
# the OpenID Connect token GitHub mints for this very run (which repository,
# which workflow file, read from main) and emails the owner through its own mail
# provider. No secret lives in any repository, and the owner's address is in none
# of them. If the email cannot be sent (the endpoint is down, not configured, or
# refuses the run) the notice becomes an issue instead, labelled
# `pipeline-notice` and assigned to the owner with an @mention, so it still
# exists and GitHub can still try to reach them.
#
# It runs AFTER the workflows it reports on, from the default branch, so it can
# fail without turning a good release red. It is not a step in release.yml
# because a release created with GITHUB_TOKEN does not trigger `on: release`,
# and a step there would ride on the release's permissions.
#
# What is NOT a notice: pull-request runs, forks, and a successful run that
# published nothing (release.yml is a no-op on every push that does not bump the
# version). To turn the whole thing off, delete this file.
#
# Every event field reaches the script through `env:`, never interpolated into
# it: a commit message is text somebody else wrote.

on:
  workflow_run:
    workflows: ["Release MCPB bundle", "CI"]
    types: [completed]
  workflow_dispatch: {}   # sends a test notice

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write   # the identity token the email is sent under

jobs:
  notify:
    runs-on: ubuntu-latest
    # This repository's own main only, never a fork's branch that happens to be called main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Open the notice
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          MAIL_URL: https://prudent.alenrozac.com/api/ops/notify
          MAIL_AUDIENCE: prudent-ops-notify
          EVENT_NAME: ${{ github.event_name }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -uo pipefail
          NAME="${REPO#*/}"

          # One short line, no backticks, safe to put inside a code span.
          oneline() { printf '%s' "$1" | tr -d '`\r' | head -n1 | cut -c1-160; }

          # The notice bodies are Markdown (they are issue text too); an email is plain text.
          plain() { sed -E 's/\*\*//g; s/`//g; s/\[([^]]+)\]\(([^)]+)\)/\1: \2/g'; }

          # Email the owner through the dashboard. Returns 0 only if the endpoint
          # accepted the notice, so the caller knows whether to fall back.
          MAIL_FAILURE=""
          email() {
            local token code
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              MAIL_FAILURE="no identity token available to this run"; echo "$MAIL_FAILURE"; return 1
            fi
            token="$(curl -fsS --max-time 20 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$MAIL_AUDIENCE" | jq -r '.value // empty')"
            if [ -z "$token" ]; then
              MAIL_FAILURE="GitHub did not issue an identity token"; echo "$MAIL_FAILURE"; return 1
            fi
            echo "::add-mask::$token"
            printf '%s' "$2" | plain > "$RUNNER_TEMP/mail.txt"
            jq -n --arg subject "$1" --rawfile text "$RUNNER_TEMP/mail.txt" '{subject: $subject, text: $text}' > "$RUNNER_TEMP/mail.json"
            code="$(curl -sS --max-time 40 -o "$RUNNER_TEMP/mail.out" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/mail.json" "$MAIL_URL")" || code=000
            if [ "$code" = 200 ]; then echo "Emailed the owner."; return 0; fi
            MAIL_FAILURE="HTTP $code $(head -c 200 "$RUNNER_TEMP/mail.out" 2>/dev/null | tr -d '\r\n`')"
            echo "Email not sent: $MAIL_FAILURE"
            return 1
          }

          # Email first; an issue only if the email did not go.
          notice() {
            if email "$1" "$2"; then return 0; fi
            gh label create pipeline-notice --repo "$REPO" --color 5319e7 \
              --description "Pipeline notice that could not be emailed" >/dev/null 2>&1 || true
            printf '%s\n\n— posted by `.github/workflows/notify.yml` · @%s · email not sent: %s\n' "$2" "$OWNER" "$MAIL_FAILURE" > "$RUNNER_TEMP/notice.md"
            gh issue create --repo "$REPO" --title "$1" --body-file "$RUNNER_TEMP/notice.md" \
              --label pipeline-notice --assignee "$OWNER" \
              || gh issue create --repo "$REPO" --title "$1" --body-file "$RUNNER_TEMP/notice.md" \
                   --label pipeline-notice
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            notice "✅ $NAME: notices are on" \
              "Test notice. From now on a release going out, or the release workflow or CI on \`main\` failing, is emailed to you. If an email cannot be sent, an issue like this one is opened instead."
            exit 0
          fi

          SHORT="${HEAD_SHA:0:7}"
          SUBJECT="$(oneline "$HEAD_MSG")"

          case "$CONCLUSION" in
            failure|timed_out)
              failed="$(gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq \
                '[.jobs[] | select(.conclusion == "failure") | .name + ": " + ([.steps[] | select(.conclusion == "failure") | .name] | join(", "))] | join("; ")' \
                2>/dev/null || true)"
              body="**$RUN_NAME** failed on \`main\` at $SHORT: \`$SUBJECT\`"
              [ -n "$failed" ] && body="$body"$'\n\n'"Failed: $failed"
              body="$body"$'\n\n'"[Open the run]($RUN_URL)"
              notice "❌ $NAME: $RUN_NAME failed ($SHORT)" "$body"
              ;;
            success)
              # Only a release published BY THIS RUN is news: the tag it made points at this commit.
              [ "$RUN_NAME" = "Release MCPB bundle" ] || exit 0
              tag="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
              [ -n "$tag" ] || exit 0
              sha="$(gh api "repos/$REPO/commits/$tag" --jq .sha 2>/dev/null || true)"
              if [ "$sha" != "$HEAD_SHA" ]; then
                echo "No release was published by this run (the latest is $tag)."
                exit 0
              fi
              notice "🚀 $NAME $tag released" \
                "**$tag** is out."$'\n\n'"[Release notes](https://github.com/$REPO/releases/tag/$tag)"$'\n\n'"Built from \`$SUBJECT\` ($SHORT). The corpus and dashboard repositories get their pin-bump pull requests next."
              ;;
            *)
              echo "Conclusion '$CONCLUSION': nothing to say."
              ;;
          esac
