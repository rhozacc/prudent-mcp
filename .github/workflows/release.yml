name: Release MCPB bundle

# Publishes the packaged server (.mcpb) as a downloadable release asset, so
# "install prudent-mcp in Claude Desktop" is a download-and-double-click.
# The dashboard's Connect page and the docs landing both link to
# /releases/latest, so they resolve as soon as one release exists.
#
# The version in package.json is the trigger. Every push to main checks whether
# a release already exists for it: if not, this builds and publishes one and
# creates the matching tag. So bumping the version in a PR and merging it ships
# a release; merging anything else is a no-op. No tag to remember to push.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish this tag instead of the package.json version (e.g. v0.5.0)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # Decide whether there is anything to publish before doing any work.
      - name: Resolve version and check for an existing release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then
            version="$(bun --print "require('./package.json').version")"
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for $tag yet — will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      # The bundle is only worth shipping if the server it packs is sound.
      - if: steps.gate.outputs.publish == 'true'
        run: bun run typecheck
      - if: steps.gate.outputs.publish == 'true'
        run: bun test

      - name: Build the .mcpb bundle
        if: steps.gate.outputs.publish == 'true'
        run: bun run build:mcpb

      - name: Name the asset
        id: meta
        if: steps.gate.outputs.publish == 'true'
        run: |
          src="$(ls -1 *.mcpb dist/mcpb/*.mcpb 2>/dev/null | head -n1)"
          if [[ -z "$src" ]]; then echo "no .mcpb produced by build:mcpb" >&2; exit 1; fi
          asset="prudent-mcp-${{ steps.gate.outputs.tag }}.mcpb"
          cp "$src" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.gate.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.asset }}
          body: |
            **Claude Desktop:** download the `.mcpb` asset below and open it — Claude Desktop
            installs the server, then set its one setting, the path to your `corpus.json`, and
            restart.

            **Claude Code:** `claude mcp add prudent --env CORPUS_FILE=/path/to/corpus.json -- bun run /path/to/prudent-mcp/src/mcpb-entry.ts`

            The bundle ships with empty adapters: it serves whatever corpus you point
            `CORPUS_FILE` at, and refuses to start on a corpus that fails validation.

      # Consumers pin this server BY TAG, so a release reaches nobody until each
      # of them moves its pin. Rather than have a human remember, tell them.
      #
      # This is a convenience, never a gate: it self-skips while the secret is
      # unset (the default GITHUB_TOKEN cannot reach another repository, so
      # there is nothing to fall back on) and `continue-on-error` means a
      # revoked or expired token can never turn a good release red. The
      # dashboard also polls daily, so the worst case of this step failing is
      # that the bump PR arrives in the morning instead of in a minute.
      # Every repo that pins this server by tag goes here. prudent-corpus
      # joined prudent-dashboard as a consumer once it split out of it — see
      # prudent-corpus#1 — and pins prudent-mcp for the same reason
      # (scripts/build-corpus.ts, scripts/link.ts import file-adapter and
      # validate). CONSUMER_DISPATCH_TOKEN must carry Contents: read and write
      # on every repo listed here; a token scoped to only the old single
      # consumer will 403 on the new one, which the loop below reports but
      # does not let block anything else.
      - name: Tell the consumers a release is out
        if: steps.gate.outputs.publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "No CONSUMER_DISPATCH_TOKEN — skipping. Consumers pick $TAG up on their own schedule."
            exit 0
          fi
          payload="$(jq -n --arg tag "$TAG" '{event_type: "mcp-released", client_payload: {tag: $tag}}')"
          for consumer in rhozacc/prudent-dashboard rhozacc/prudent-corpus; do
            echo "$payload" | gh api "repos/$consumer/dispatches" --input - \
              && echo "Dispatched to $consumer." \
              || echo "::warning::Could not dispatch to $consumer — it picks $TAG up on its own schedule instead."
          done
